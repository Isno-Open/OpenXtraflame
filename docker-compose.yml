version: '3.8'

services:
  esp-idf:
    build:
      context: .
      dockerfile: Dockerfile.esp-idf
    image: openextraflame/esp-idf
    container_name: openextraflame-build
    volumes:
      # La racine du depot, pas firmware/ seul : le brochage est engendre
      # depuis boards/<carte>.json par tools/gen_board.py.
      - .:/project
      - ./web:/web
    working_dir: /project/firmware
    environment:
      - IDF_TARGET=esp32
    devices:
      # Adjust to your USB-UART device path
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    stdin_open: true
    tty: true
    command: /bin/bash

# Usage :
#   docker compose build
#   docker compose run --rm esp-idf idf.py set-target esp32
#   docker compose run --rm esp-idf idf.py -B build-external -DBOARD=external build
#   docker compose run --rm esp-idf idf.py -B build-blacklabel -DBOARD=blacklabel build
#   docker compose run --rm esp-idf idf.py -p /dev/ttyUSB0 flash monitor
